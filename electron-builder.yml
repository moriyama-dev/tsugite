---
appId: io.github.moriyama_dev.Tsugite
productName: Tsugite
compression: normal
npmRebuild: false
protocols:
  - name: Tsugite URL
    schemes:
      - tsugite
files:
- '**/*'
- dist
- '!lib'
- '!src'
- '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,node.lib}'
- '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples,docs}'
- '!**/node_modules/@angular/common/locales'
- '!**/node_modules/@angular/compiler/src'
- '!**/node_modules/node-gyp'
- '!**/node_modules/**/*.d.ts'
- '!**/node_modules/**/*.map'
- '!**/node_modules/**/include/node'
- '!**/node_modules/.bin'
- '!**/node_modules/*/*/{esm5,fesm5,esm2015,fesm2015,_esm2015,_fesm2015}'
- '!**/node_modules/**/Release/obj'
- '!**/node_modules/**/*.{exp,iobj,ipdb,lib}'
- '!**/node_modules/**/*.vcxproj*'
- '!**/*.{woff,ttf,otf,eot}'
- '!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}'
- '!.editorconfig'
- '!**/._*'
- '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}'
- '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
- '!**/{appveyor.yml,.travis.yml,circle.yml}'
- '!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}'
- '!**/deps/cpu_features/build'
- '!**/node_modules/node-pty/third_party'
- '!**/node_modules/node-pty/prebuilds/*/conpty'
extraResources:
- builtin-plugins
asarUnpack:
- 'dist/*.map'
- node_modules/keytar/build/Release/*.node
- node_modules/**/*.node
mac:
  category: public.app-category.developer-tools
  icon: "./build/mac/icon.icns"
  artifactName: tsugite-${version}-macos-${env.ARCH}.${ext}
  # Unsigned build (no Apple Developer ID); the Homebrew cask clears the quarantine flag
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSRequiresAquaSystemAppearance: false
    NSCameraUsageDescription: "A subprocess requests access to the device's camera."
    NSMicrophoneUsageDescription: "A subprocess requests access to the device's microphone."
    NSLocationUsageDescription: "A subprocess requests access to the user's location information."
    NSDesktopFolderUsageDescription: "A subprocess requests access to the user's Desktop folder."
    NSDocumentsFolderUsageDescription: "A subprocess requests access to the user's Documents folder."
    NSDownloadsFolderUsageDescription: "A subprocess requests access to the user's Downloads folder."
    NSNetworkVolumesUsageDescription: 'A subprocess requests access to files on a network volume.'
    NSRemovableVolumesUsageDescription: 'A subprocess requests access to files on a removable volume.'
    NSAppleEventsUsageDescription: 'A subprocess requests permission to send AppleScript events to another application.'
dmg:
  artifactName: tsugite-${version}-macos-${env.ARCH}.${ext}

linux:
  category: "Utility;TerminalEmulator;Network"
  icon: "./build/icons"
  artifactName: tsugite-${version}-linux-${env.ARCH}.${ext}
  synopsis: Terminal-first SSH client with Tailscale and Claude Code
  description: |
    Tsugite is a terminal-first SSH client. It lists the machines on your Tailscale
    network, opens a terminal on any of them with one click and can start Claude Code
    there in the folder you choose. Saved SSH connections work the same way.
  executableArgs:
  - "--no-sandbox"
  desktop:
    entry:
      StartupWMClass: Tsugite
      MimeType: x-scheme-handler/tsugite
      Comment: Terminal-first SSH client with Tailscale and Claude Code
      Comment[ja]: Tailscale と Claude Code が使える、ターミナルが主役の SSH クライアント
      Keywords: ssh;terminal;tailscale;claude;
deb:
  packageName: tsugite
  depends:
  - libnotify4
  - libsecret-1-0
  - libxtst6
  - libnss3
  recommends:
  - gnome-keyring
  - tmux
  afterInstall: build/linux/after-install.tpl
  afterRemove: build/linux/after-remove.tpl
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
