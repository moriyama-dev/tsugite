accessibility:
  animations: true
appearance:
  dock: off
  dockScreen: current
  dockFill: 0.5
  dockSpace: 1
  dockHideOnBlur: false
  dockAlwaysOnTop: true
  flexTabs: false
  tabsLocation: top
  tabsInFullscreen: false
  cycleTabs: true
  theme: Follow the color scheme
  frame: thin
  css: '/* * { color: blue !important; } */'
  opacity: 1.0
  vibrancy: false
  vibrancyType: 'blur'
  lastTabClosesWindow: false
  spaciness: 1
  colorSchemeMode: 'dark'
terminal:
  showBuiltinProfiles: true
  showRecentProfiles: 3
  paneResizeStep: 0.1
  focusFollowsMouse: false
  identification: null
hotkeys:
  profile:
    __nonStructural: true
  profile-selectors:
    __nonStructural: true
  group-selectors:
    __nonStructural: true
profiles: []
groups: []
profileDefaults:
  __nonStructural: true
  ssh:
    disableDynamicTitle: true
recoverTabs: true
enableAnalytics: false
enableWelcomeTab: true
electronFlags: []
enableAutomaticUpdates: false
hideTray: false
version: 1
vault: null
encrypted: false
enableExperimentalFeatures: false
pluginBlacklist: []
commandBlacklist: []
providerBlacklist: []
profileBlacklist: []
hacks:
  disableGPU: false
  disableVibrancyWhileDragging: false
  enableFluentBackground: false
  globalHotkey: null
language: null
defaultQuickConnectProvider: "ssh"
showProfileTree: true
tsugite:
  # Used for Tailscale machines that have no username of their own; empty means the local username
  defaultUser: ''
  showOffline: false
  machines:
    __nonStructural: true
  assist:
    sendOnEnter: true
    notify: true
    # null until edited: the built-in snippets are shown in the interface language
    snippets: null
